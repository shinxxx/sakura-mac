name: macOS Build

on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
    paths:
      - 'macos/**'
      - 'help/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

jobs:
  # 与 build-sakura.yml 的 check-encoding 相同的规则：Mac 版新增的 .cpp / .h / .mm 必须是带 BOM 的 UTF-8
  check-encoding:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check encoding
        run: |
          ng=0
          while IFS= read -r -d '' f; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' ')" != "efbbbf" ]; then
              echo "NG (not UTF-8 with BOM): $f"; ng=1
            fi
          done < <(git ls-files -z -- 'macos/*.h' 'macos/*.cpp' 'macos/*.mm')
          exit $ng

      # 第 48 步：各语言的对话框布局（*.lproj/*Dialogs.json）、Mac 版自己的文字的翻译（Localizable.strings）与生成工具的结果相同，翻译没有遗漏
      - name: Check localization resources
        run: |
          python3 macos/tools/settings/make_prop_dialogs.py
          python3 macos/tools/l10n/make_strings.py --check
          git diff --exit-code -- macos/app/Resources

      # 第 49 步：ヘルプの目次・キーワード・話題・控件の説明（HelpTopics.json）が原版のヘルプ（help/）から生成した結果と同じ
      - name: Check help data
        run: python3 macos/tools/help/make_help_data.py --check

  # 第 14 步：UTF-16 字符类型（sakura_core/util/wchar16.h）在两个平台上编译并运行测试
  wchar16-test-macos:
    needs: check-encoding
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run test_wchar16 (clang, arm64)
        run: |
          clang++ -std=c++20 -Wall -Wextra -DNOMINMAX -arch arm64 \
            -I macos/platform/include -I sakura_core \
            macos/platform/tests/test_wchar16.cpp -o test_wchar16
          macos/tools/check-arch.sh test_wchar16
          ./test_wchar16

  # 第 16 步：Mac 版核心库（macos/core）的构建和单元测试
  core-tests-macos:
    needs: check-encoding
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 第 19 步：正则（Onigmo、bregonig）和 C/Migemo 作为源码编进核心库
      - name: Checkout submodules
        run: git submodule update --init --depth 1 externals/Onigmo externals/bregonig externals/cmigemo

      - name: Configure
        run: cmake -S macos/core -B build/mac-core -DCMAKE_BUILD_TYPE=Debug -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build/mac-core -j 4

      # 只含 arm64（Mac 版只支持 Apple 芯片）
      - name: Check architecture
        run: macos/tools/check-arch.sh build/mac-core/*.a build/mac-core/sakura_core_tests

      - name: Test
        run: ctest --test-dir build/mac-core --output-on-failure -j 4

  # 第 36 步：性能测试。核心库用 Release 构建（App Store 版相同的优化），全部测试 + 大文件、超长行的计时（[PERF] 的行）
  core-perf-macos:
    needs: check-encoding
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout submodules
        run: git submodule update --init --depth 1 externals/Onigmo externals/bregonig externals/cmigemo

      - name: Configure (Release)
        run: cmake -S macos/core -B build/mac-core-release -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/mac-core-release -j 4

      # Release 构建也全部通过（优化后才出现的问题，例如对齐）
      - name: Test (Release)
        run: ctest --test-dir build/mac-core-release --output-on-failure -j 4 -E 'MacPerfTest'

      - name: Performance (Release)
        run: |
          sysctl -n machdep.cpu.brand_string
          ./build/mac-core-release/sakura_core_tests --gtest_filter='MacPerfTest.*' | tee perf-macos.txt
          echo '## macOS（核心库 Release）' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '^\[PERF\]' perf-macos.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # 第 36 步：Windows 版（官方发布的 sakura.exe）用同样的文件、同样的操作计时（宏 macos/tools/perf/windows-bench.js）
  perf-windows:
    needs: check-encoding
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Sakura Editor (official release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view --repo sakura-editor/sakura --json tagName,assets | ConvertFrom-Json
          $rel.assets | ForEach-Object { $_.name }
          # 官方版只有 Win32 的时候用 Win32（有 x64 时优先 x64）
          $exes = $rel.assets | Where-Object { $_.name -like '*.zip' -and $_.name -match 'Release' -and $_.name -match 'Exe' }
          $asset = @($exes | Where-Object { $_.name -match 'x64' }) + @($exes | Where-Object { $_.name -match 'Win32' }) | Select-Object -First 1
          if (-not $asset) { throw "Release Exe zip not found in $($rel.tagName)" }
          gh release download $rel.tagName --repo sakura-editor/sakura --pattern $asset.name --dir dl
          Expand-Archive "dl/$($asset.name)" -DestinationPath sakura
          "Sakura Editor $($rel.tagName) ($($asset.name))" | Tee-Object perf-version.txt

      - name: Make test files
        run: python macos/tools/perf/make_perf_files.py perf

      - name: Run benchmark macro
        run: |
          (Get-CimInstance Win32_Processor).Name
          $exe = (Get-ChildItem -Recurse sakura -Filter sakura.exe | Select-Object -First 1).FullName
          $dir = (Resolve-Path perf).Path
          $template = Get-Content macos/tools/perf/windows-bench.js -Raw -Encoding utf8
          foreach ($kind in 'large', 'long') {
            $out = Join-Path $dir "result-$kind.txt"
            $js = $template.Replace('@FILE@', (Join-Path $dir "$kind.txt").Replace('\', '\\')).Replace('@OUT@', $out.Replace('\', '\\')).Replace('@KIND@', $kind)
            $macro = Join-Path $dir "bench-$kind.js"
            Set-Content $macro $js -Encoding utf8BOM
            $p = Start-Process $exe -ArgumentList "-M=`"$macro`"" -PassThru
            $deadline = (Get-Date).AddMinutes(10)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              if ((Test-Path $out) -and (Select-String -Path $out -Pattern ': done' -Quiet)) { break }
            }
            Get-Process sakura -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            if (Test-Path $out) { Get-Content $out } else { Write-Host "::error::no result for $kind" }
          }
          $all = Get-ChildItem $dir -Filter 'result-*.txt' | Get-Content
          '## Windows（官方发布版 sakura.exe）' >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content perf-version.txt >> $env:GITHUB_STEP_SUMMARY
          $all >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if (-not ($all -match 'large: done') -or -not ($all -match 'long: done')) { throw 'benchmark did not finish' }
          if ($all -match 'error:') { throw 'benchmark macro reported an error' }

  # 第 42 步：Windows 版（官方发布的 sakura.exe）的アウトライン解析结果。打开 Mac 版测试的样本文件
  # （macos/core/tests/data/outline），用 UI Automation 读出对话框的ツリー・リスト和「コピー」的文字，
  # 与 Mac 版测试比较的 expected 文件相同（macos/tools/outline/windows-outline.ps1）
  outline-windows:
    needs: check-encoding
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Sakura Editor (official release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view --repo sakura-editor/sakura --json tagName,assets | ConvertFrom-Json
          $exes = $rel.assets | Where-Object { $_.name -like '*.zip' -and $_.name -match 'Release' -and $_.name -match 'Exe' }
          $asset = @($exes | Where-Object { $_.name -match 'x64' }) + @($exes | Where-Object { $_.name -match 'Win32' }) | Select-Object -First 1
          if (-not $asset) { throw "Release Exe zip not found in $($rel.tagName)" }
          gh release download $rel.tagName --repo sakura-editor/sakura --pattern $asset.name --dir dl
          Expand-Archive "dl/$($asset.name)" -DestinationPath sakura
          "Sakura Editor $($rel.tagName) ($($asset.name))"

      # sakura.exe は 32 位：32 位的 Windows PowerShell 运行（读 TreeView・ListView 的结构体的大小相同）
      - name: Run outline analysis
        shell: cmd
        run: |
          for /f "delims=" %%i in ('dir /s /b sakura\sakura.exe') do set EXE=%%i
          %SystemRoot%\SysWOW64\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File macos\tools\outline\windows-outline.ps1 -SakuraExe "%EXE%" -DataDir macos\core\tests\data\outline -OutDir outline-result

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outline-windows
          path: |
            outline-result/*.txt
            outline-result/*.png

      - name: Compare with expected
        shell: pwsh
        run: |
          $ng = 0
          foreach ($f in Get-ChildItem macos/core/tests/data/outline/expected -Filter *.txt) {
            $actual = Join-Path outline-result $f.Name
            if (-not (Test-Path $actual)) { Write-Host "::error::no result: $($f.Name)"; $ng = 1; continue }
            git diff --no-index --exit-code -- $f.FullName $actual
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::differs from Windows: $($f.Name)"; $ng = 1 }
          }
          exit $ng

  # 第 43 步：Grep 的结果与 Windows 官方版 sakura.exe 相同（-GREPMODE 的标准输出与 macos/core/tests/data/grep/expected 比较）
  grep-windows:
    needs: check-encoding
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Sakura Editor (official release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view --repo sakura-editor/sakura --json tagName,assets | ConvertFrom-Json
          $exes = $rel.assets | Where-Object { $_.name -like '*.zip' -and $_.name -match 'Release' -and $_.name -match 'Exe' }
          $asset = @($exes | Where-Object { $_.name -match 'x64' }) + @($exes | Where-Object { $_.name -match 'Win32' }) | Select-Object -First 1
          if (-not $asset) { throw "Release Exe zip not found in $($rel.tagName)" }
          gh release download $rel.tagName --repo sakura-editor/sakura --pattern $asset.name --dir dl
          Expand-Archive "dl/$($asset.name)" -DestinationPath sakura
          "Sakura Editor $($rel.tagName) ($($asset.name))"

      - name: Run grep
        shell: cmd
        run: |
          for /f "delims=" %%i in ('dir /s /b sakura\sakura.exe') do set EXE=%%i
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File macos\tools\grep\windows-grep.ps1 -SakuraExe "%EXE%" -DataDir macos\core\tests\data\grep -OutDir grep-result

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grep-windows
          path: |
            grep-result/*.txt

      - name: Compare with expected
        shell: pwsh
        run: |
          $ng = 0
          foreach ($f in Get-ChildItem macos/core/tests/data/grep/expected -Filter *.txt) {
            $actual = Join-Path grep-result $f.Name
            if (-not (Test-Path $actual)) { Write-Host "::error::no result: $($f.Name)"; $ng = 1; continue }
            git diff --no-index --exit-code -- $f.FullName $actual
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::differs from Windows: $($f.Name)"; $ng = 1 }
          }
          exit $ng

  # 第 44 步：编辑辅助功能（対括弧・ブックマーク・差分 等）的结果与 Windows 官方版 sakura.exe 相同
  # （宏 macos/tools/editsupport/windows-edit-support.js 的输出与 macos/core/tests/data/editsupport/expected 比较）
  edit-support-windows:
    needs: check-encoding
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Sakura Editor (official release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view --repo sakura-editor/sakura --json tagName,assets | ConvertFrom-Json
          $exes = $rel.assets | Where-Object { $_.name -like '*.zip' -and $_.name -match 'Release' -and $_.name -match 'Exe' }
          $asset = @($exes | Where-Object { $_.name -match 'x64' }) + @($exes | Where-Object { $_.name -match 'Win32' }) | Select-Object -First 1
          if (-not $asset) { throw "Release Exe zip not found in $($rel.tagName)" }
          gh release download $rel.tagName --repo sakura-editor/sakura --pattern $asset.name --dir dl
          Expand-Archive "dl/$($asset.name)" -DestinationPath sakura
          "Sakura Editor $($rel.tagName) ($($asset.name))"
          Get-ChildItem -Recurse sakura | ForEach-Object { $_.FullName }

      # 原版 DIFF差分表示 が呼ぶ diff.exe（GNU diffutils。上游的 build-sakura.yml と同じ GnuWin32 版）
      - name: Install DiffUtils (winget)
        run: |
          winget install --id GnuWin32.DiffUtils --exact --accept-package-agreements --accept-source-agreements --disable-interactivity
          $diff = Get-ChildItem -Recurse "${env:ProgramFiles(x86)}\GnuWin32", "$env:ProgramFiles\GnuWin32" -Filter diff.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $diff) { throw 'diff.exe not found' }
          "DIFF_EXE=$($diff.FullName)" >> $env:GITHUB_ENV

      - name: Run macro
        run: |
          $exe = (Get-ChildItem -Recurse sakura -Filter sakura.exe | Select-Object -First 1).FullName
          ./macos/tools/editsupport/windows-edit-support.ps1 -SakuraExe $exe -DataDir macos/core/tests/data/editsupport -OutDir edit-support-result -DiffExe $env:DIFF_EXE

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edit-support-windows
          path: |
            edit-support-result/*.txt
            edit-support-result/*.png

      - name: Compare with expected
        run: |
          $ng = 0
          foreach ($f in Get-ChildItem macos/core/tests/data/editsupport/expected -Filter *.txt) {
            $actual = Join-Path edit-support-result $f.Name
            if (-not (Test-Path $actual)) { Write-Host "::error::no result: $($f.Name)"; $ng = 1; continue }
            git diff --no-index --exit-code -- $f.FullName $actual
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::differs from Windows: $($f.Name)"; $ng = 1 }
          }
          exit $ng

  # 第 45 步：同じ JScript マクロを官方发布的 sakura.exe で実行し、Mac 版の App 単元テスト（JSMacroTests.testWindowsCompare）と同じ期待値と比べる
  macro-windows:
    needs: check-encoding
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Sakura Editor (official release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view --repo sakura-editor/sakura --json tagName,assets | ConvertFrom-Json
          $exes = $rel.assets | Where-Object { $_.name -like '*.zip' -and $_.name -match 'Release' -and $_.name -match 'Exe' }
          $asset = @($exes | Where-Object { $_.name -match 'x64' }) + @($exes | Where-Object { $_.name -match 'Win32' }) | Select-Object -First 1
          if (-not $asset) { throw "Release Exe zip not found in $($rel.tagName)" }
          gh release download $rel.tagName --repo sakura-editor/sakura --pattern $asset.name --dir dl
          Expand-Archive "dl/$($asset.name)" -DestinationPath sakura
          "Sakura Editor $($rel.tagName) ($($asset.name))"

      - name: Run macro
        run: |
          $exe = (Get-ChildItem -Recurse sakura -Filter sakura.exe | Select-Object -First 1).FullName
          ./macos/tools/macro/windows-macro.ps1 -SakuraExe $exe -Macro macos/app/Tests/MacroSamples/WindowsCompare.js -OutDir macro-result

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macro-windows
          path: |
            macro-result/*.txt
            macro-result/*.png
            macro-result/macro.js

      - name: Compare with expected
        run: |
          $expected = 'macos/app/Tests/MacroSamples/WindowsCompare.txt'
          if (-not (Test-Path $expected)) { Get-Content macro-result/WindowsCompare.txt; Write-Host "::error::no expected file"; exit 1 }
          git diff --no-index --exit-code -- $expected macro-result/WindowsCompare.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::differs from Windows"; exit 1 }

  # 第 46 步：バックアップファイル名を官方发布的 sakura.exe で作り、Mac 版の核心库测试（MacBackupTest.BackupWindowsComparison）と同じ期待値と比べる
  backup-windows:
    needs: check-encoding
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Sakura Editor (official release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view --repo sakura-editor/sakura --json tagName,assets | ConvertFrom-Json
          $exes = $rel.assets | Where-Object { $_.name -like '*.zip' -and $_.name -match 'Release' -and $_.name -match 'Exe' }
          $asset = @($exes | Where-Object { $_.name -match 'x64' }) + @($exes | Where-Object { $_.name -match 'Win32' }) | Select-Object -First 1
          if (-not $asset) { throw "Release Exe zip not found in $($rel.tagName)" }
          gh release download $rel.tagName --repo sakura-editor/sakura --pattern $asset.name --dir dl
          Expand-Archive "dl/$($asset.name)" -DestinationPath sakura
          "Sakura Editor $($rel.tagName) ($($asset.name))"

      - name: Save with backups
        run: |
          $exe = (Get-ChildItem -Recurse sakura -Filter sakura.exe | Select-Object -First 1).FullName
          ./macos/tools/backup/windows-backup.ps1 -SakuraExe $exe -Cases macos/core/tests/data/backup/cases.tsv -OutDir backup-result

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-windows
          path: |
            backup-result/*.txt
            backup-result/*.png

      - name: Compare with expected
        run: |
          git diff --no-index --exit-code -- macos/core/tests/data/backup/expected.txt backup-result/backup.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::differs from Windows"; exit 1 }

  # 第 47 步：Windows の官方版で印刷（Microsoft Print to PDF）し、PDF の文字の位置を Mac 版の排版
  # （macos/core/tests/data/print/expected.txt）と比べる（差は 0.2 mm まで）
  print-windows:
    needs: check-encoding
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Sakura Editor (official release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view --repo sakura-editor/sakura --json tagName,assets | ConvertFrom-Json
          $exes = $rel.assets | Where-Object { $_.name -like '*.zip' -and $_.name -match 'Release' -and $_.name -match 'Exe' }
          $asset = @($exes | Where-Object { $_.name -match 'x64' }) + @($exes | Where-Object { $_.name -match 'Win32' }) | Select-Object -First 1
          if (-not $asset) { throw "Release Exe zip not found in $($rel.tagName)" }
          gh release download $rel.tagName --repo sakura-editor/sakura --pattern $asset.name --dir dl
          Expand-Archive "dl/$($asset.name)" -DestinationPath sakura
          "Sakura Editor $($rel.tagName) ($($asset.name))"

      - name: Print to PDF
        run: |
          $exe = (Get-ChildItem -Recurse sakura -Filter sakura.exe | Select-Object -First 1).FullName
          ./macos/tools/print/windows-print.ps1 -SakuraExe $exe -DataDir macos/core/tests/data/print -OutDir print-result

      - name: Extract characters
        run: |
          pip install pdfminer.six==20250506
          $pdfs = Get-ChildItem print-result -Filter *.pdf | ForEach-Object { "$($_.BaseName)=$($_.FullName)" }
          python macos/tools/print/print_pdf_chars.py @pdfs > print-result/print.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: print-windows
          path: print-result/*.*

      - name: Compare with expected
        run: |
          python macos/tools/print/compare_print.py macos/core/tests/data/print/expected.txt print-result/print.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::differs from Windows"; exit 1 }

  wchar16-test-windows:
    needs: check-encoding
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run test_wchar16 (MSVC x64)
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /utf-8 /DNOMINMAX /DUNICODE /D_UNICODE /I sakura_core macos\platform\tests\test_wchar16.cpp /Fe:test_wchar16.exe || exit /b 1
          test_wchar16.exe

  # 第 17 步：在 Windows 上导出代码页转换表（Mac 版的 MultiByteToWideChar 等按这份表实现）。
  # 导出结果作为 artifact 上传；仓库里已提交 macos/platform/data/codepages.bin 时，检查两者一致。
  codepage-dump-windows:
    needs: check-encoding
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run dump_codepages (MSVC x64)
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /utf-8 /DUNICODE /D_UNICODE macos\tools\codepage_dump\dump_codepages.cpp /Fe:dump_codepages.exe || exit /b 1
          mkdir out
          dump_codepages.exe out\codepages.bin out\codepages.tsv > probes.txt || (type probes.txt & exit /b 1)
          ver > out\windows-version.txt
          tar -czf codepages.tgz -C out codepages.bin codepages.tsv windows-version.txt || exit /b 1
          certutil -f -encode codepages.tgz codepages.b64 > nul || exit /b 1

      # artifact を取り出せない環境のために、ログにも base64 で出す（BEGIN/END の行の間）
      - name: Print table as base64
        run: type codepages.b64

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codepages
          path: out/

      - name: Compare with committed table
        run: |
          if not exist macos\platform\data\codepages.bin exit /b 0
          fc /b out\codepages.bin macos\platform\data\codepages.bin > nul || echo ::warning::codepages.bin differs from the table dumped on this Windows version

      # 各代码页的探测结果（Mac 版的实现按这里核对）。放在最后，方便只看日志末尾
      - name: Print probe results
        run: type probes.txt

  build:
    needs: check-encoding
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 第 24 步：App 通过桥接层链接核心库，核心库用到这些子模块
      - name: Checkout submodules
        run: git submodule update --init --depth 1 externals/Onigmo externals/bregonig externals/cmigemo

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: macos/app
        run: xcodegen generate

      - name: Build (Release, unsigned)
        working-directory: macos/app
        run: |
          set -o pipefail
          # 只支持 Apple 芯片（arm64）：Config/App.xcconfig 的 ARCHS = arm64
          xcodebuild \
            -project SakuraMac.xcodeproj \
            -scheme SakuraMac \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # 第 24 步：桥接层的单元测试（Swift 通过桥接层打开文件、读出文字）
      - name: Test bridge (Debug)
        working-directory: macos/app
        run: |
          set -o pipefail
          xcodebuild \
            -project SakuraMac.xcodeproj \
            -scheme SakuraMac \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SakuraMacTests \
            test

      # 自动界面测试（XCUITest）：真的启动 App 用键盘和菜单操作。界面测试的运行器必须签名，用本机签名（ad-hoc）
      - name: UI tests (Debug)
        working-directory: macos/app
        run: |
          set -o pipefail
          xcodebuild \
            -project SakuraMac.xcodeproj \
            -scheme SakuraMac \
            -configuration Debug \
            -derivedDataPath build \
            -resultBundlePath build/ui-tests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -only-testing:SakuraMacUITests \
            test

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: macos/app/build/ui-tests.xcresult

      - name: Check app bundle
        working-directory: macos/app
        run: |
          APP="build/Build/Products/Release/Sakura Editor for Mac.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Contents/Info.plist"
          # 第 48 步：日文、英文、简体中文的资源
          /usr/libexec/PlistBuddy -c 'Print CFBundleLocalizations' "$APP/Contents/Info.plist"
          for lang in ja en zh-Hans; do test -f "$APP/Contents/Resources/$lang.lproj/CommonSettingsDialogs.json"; done
          for lang in en zh-Hans; do test -f "$APP/Contents/Resources/$lang.lproj/Localizable.strings"; done
          # 只含 arm64（Mac 版只支持 Apple 芯片）：App、嵌在 App 里的桥接层框架、Release 和 Debug 的核心库
          ../tools/check-arch.sh \
            "$APP/Contents/MacOS/Sakura Editor for Mac" \
            "$APP/Contents/Frameworks/EditorBridge.framework/EditorBridge" \
            "build/Build/Products/Debug/Sakura Editor for Mac.app/Contents/MacOS/Sakura Editor for Mac" \
            ../../build/xcode-core/Release/libsakura_core_api.a \
            ../../build/xcode-core/Debug/libsakura_core_api.a

      # 第 9 步：确认 App 能启动，不会一启动就崩溃（CI 没有屏幕可看，只确认进程启动 10 秒后仍在运行）
      - name: Launch smoke test
        working-directory: macos/app
        run: |
          APP="build/Build/Products/Release/Sakura Editor for Mac.app"
          "$APP/Contents/MacOS/Sakura Editor for Mac" > launch.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 $PID 2>/dev/null; then
            echo "::error::App exited within 10 seconds"
            cat launch.log
            exit 1
          fi
          osascript -e 'tell application "System Events" to get name of every window of (first process whose unix id is '"$PID"')' || true
          kill $PID
          wait $PID 2>/dev/null || true
          cat launch.log
