name: Cppcheck

on:
  # 2026-11-09 迁移到独立仓库 sakura-mac 后，项目负责人决定：Windows 的检查只手动运行（Actions 页面的 Run workflow）。
  workflow_dispatch:

jobs:
  cppcheck:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        BuildPlatform: [Win32, x64]
        Configuration: [Release]
    env:
      BuildPlatform: ${{ matrix.BuildPlatform }}
      Configuration: ${{ matrix.Configuration }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cppcheck

      - name: Show environment variables for debug
        run: set
        shell: cmd

      - name: Run cppcheck
        run: ./run-cppcheck.bat ${{ env.BuildPlatform }} ${{ env.Configuration }}
        shell: msys2 {0}

      - name: Zip files for artifacts
        run: zipArtifacts.bat ${{ env.BuildPlatform }} ${{ env.Configuration }}
        shell: cmd

      - name: Upload cppcheck log artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cppcheck_${{ env.BuildPlatform }}_${{ env.Configuration }}
          path: '**Log.zip'
