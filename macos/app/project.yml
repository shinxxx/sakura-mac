# XcodeGen 工程定义。生成 Xcode 工程：
#   brew install xcodegen
#   cd macos/app && xcodegen generate
# 生成的 SakuraMac.xcodeproj 不提交到仓库。
#
# 构建前还需要（第 24 步起，核心库用 CMake 构建）：
#   brew install cmake
#   git submodule update --init externals/Onigmo externals/bregonig externals/cmigemo
name: SakuraMac
options:
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  SakuraMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # 第 39、40 步：共通設定・タイプ別設定窗口的布局（原版的对话框模板，macos/tools/settings/make_prop_dialogs.py 生成）
      # 第 41 步：ツールバーのアイコン mytool.bmp（原版 IDB_MYTOOL。src/main/resources/images へのシンボリックリンク）
      - path: Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SakuraMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        PRODUCT_MODULE_NAME: SakuraMac
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: EditorBridge
    scheme:
      testTargets:
        - SakuraMacTests
        - SakuraMacUITests

  # 桥接层（第 24 步）：把核心库（macos/core，C++）用 Objective-C++ 包装，提供给 Swift。
  # 构建前先运行 Scripts/build-core.sh，用 CMake 构建核心库的静态库，再链接进这个框架。
  EditorBridge:
    type: framework
    platform: macOS
    sources:
      - path: ../bridge/src
      - path: ../bridge/include
        headerVisibility: public
    dependencies:
      - sdk: CoreText.framework   # 第 27 步：用 Core Text 测文字宽度
    preBuildScripts:
      - name: Build sakura core (CMake)
        script: '"${SRCROOT}/Scripts/build-core.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: EditorBridge
        PRODUCT_MODULE_NAME: EditorBridge
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).EditorBridge
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        SAKURA_CORE_BUILD_DIR: $(SRCROOT)/../../build/xcode-core/$(CONFIGURATION)
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
        LIBRARY_SEARCH_PATHS: $(SAKURA_CORE_BUILD_DIR)
        OTHER_LDFLAGS: -lsakura_core_api -lsakura_core -lbregonig -lonigmo -lcmigemo
        # 脚本要读写仓库里的 build/ 目录
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # 单元测试：桥接层（第 24 步）、自绘视图的输入法接口（第 25 步）、文档和窗口（第 26 步）。
  # 测试不启动 App，要测的源文件直接编进测试
  SakuraMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/EditorTextView.swift
      - path: Sources/EditorWindowController.swift
      - path: Sources/SakuraDocument.swift
      - path: Sources/FileDialogAccessory.swift
      # 第 31 步：安全书签、历史菜单（菜单的动作用 SakuraDocumentController）
      - path: Sources/SecurityScopedBookmarks.swift
      - path: Sources/RecentMenu.swift
      - path: Sources/SakuraDocumentController.swift
      # 第 32 步：查找、置换、指定行へジャンプ
      - path: Sources/SearchCommands.swift
      - path: Sources/SearchDialogs.swift
      # 第 34 步：菜单与快捷键
      - path: Sources/CommandTable.swift
      - path: Sources/KeyCommands.swift
      - path: Sources/MainMenuBuilder.swift
      - path: Sources/CursorCommands.swift
      - path: Sources/ModeCommands.swift
      - path: Sources/FileCommands.swift
      - path: Sources/AboutPanel.swift
      - path: Sources/SettingsImport.swift
      # 第 39 步：共通設定窗口
      - path: Sources/CommonSettingsWindow.swift
      - path: Sources/CommonSettingsPages.swift
      - path: Sources/WindowsDateFormat.swift
      - path: Resources/CommonSettingsDialogs.json
        buildPhase: resources
      # 第 40 步：タイプ別設定窗口
      - path: Sources/TypeSettingsWindow.swift
      - path: Sources/TypeSettingsPages.swift
      - path: Sources/TypeSettingsColor.swift
      - path: Sources/TypeSettingsRegexKeyHelp.swift
      - path: Sources/KeywordSettingsPage.swift
      - path: Sources/TypeListDialog.swift
      - path: Resources/TypeSettingsDialogs.json
        buildPhase: resources
      # 第 41 步：共通設定 > キー割り当て・メインメニュー・ツールバー・カスタムメニュー
      - path: Sources/KeyBindPage.swift
      - path: Sources/MainMenuPage.swift
      - path: Sources/CustomMenuToolbarPages.swift
      - path: Resources/mytool.bmp	# ツールバーのアイコン（原版 IDB_MYTOOL。src/main/resources/images へのリンク）
        buildPhase: resources
      # 第 42 步：アウトライン解析
      - path: Sources/OutlineWindow.swift
      - path: Sources/OutlineDock.swift
      - path: Resources/OutlineDialogs.json
        buildPhase: resources
      # 第 43 步：Grep・Grep置換・タグジャンプ・ファイルツリー
      - path: Sources/GrepDialog.swift
      - path: Sources/GrepRunner.swift
      - path: Sources/TagJump.swift
      - path: Sources/FileTreeOutline.swift
      - path: Sources/FileTreeDialog.swift
      - path: Resources/GrepDialogs.json
        buildPhase: resources
      - path: ../core/tests/data/grep/tree
        type: folder
        buildPhase: resources
      # 第 44 步：編集支援
      - path: Sources/BracketPair.swift
      - path: Sources/Bookmark.swift
      - path: Sources/ISearch.swift
      - path: Sources/StatusMessage.swift
      - path: Sources/DiffCommands.swift
      - path: Sources/Hokan.swift
      - path: Sources/KeywordHelp.swift
      - path: Sources/TagJumpList.swift
      - path: Resources/EditSupportDialogs.json
        buildPhase: resources
      # 第 30 步：第 18 步的编码样本（在 App 里打开再保存，字节不变）
      - path: ../core/tests/data/roundtrip
        type: folder
        buildPhase: resources
    dependencies:
      - target: EditorBridge
    settings:
      base:
        PRODUCT_NAME: SakuraMacTests
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @loader_path/../Frameworks @executable_path/../Frameworks

  # 自动界面测试（XCUITest）：真的启动 App 用键盘和菜单操作，确认已经完成的步骤的主要功能。
  # 在自己的 Mac 上一次跑完全部测试：macos/tools/run-tests.sh
  SakuraMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: SakuraMac
    settings:
      base:
        PRODUCT_NAME: SakuraMacUITests
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: SakuraMac
